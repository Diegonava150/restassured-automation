# Logging for the test run.
#
# This file sat in src/test/ for the life of the project, which is not a resource root — so it
# was never on the classpath and never loaded. It also set rootLogger.level=debug, which was
# harmless while nothing read it and produced 44 KB of Apache HttpClient wire logging the moment
# the SLF4J binding was fixed and it finally did. Both are fixed; the levels below are chosen
# rather than inherited.

status=warn
name=ApiSuiteLogging

appender.console.type=Console
appender.console.name=consoleLogger
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{HH:mm:ss} %-5level %c{1} - %m%n

property.basePath=target/logs

appender.rolling.type=RollingFile
appender.rolling.name=fileLogger
appender.rolling.fileName=${basePath}/execution.log
appender.rolling.filePattern=${basePath}/app_%d{yyyyMMdd}.log.gz
appender.rolling.layout.type=PatternLayout
appender.rolling.layout.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%c{3}:%L] - %msg%n
appender.rolling.policies.type=Policies
appender.rolling.policies.size.type=SizeBasedTriggeringPolicy
appender.rolling.policies.size.size=10MB
appender.rolling.policies.time.type=TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval=1
appender.rolling.policies.time.modulate=true
appender.rolling.strategy.type=DefaultRolloverStrategy
appender.rolling.strategy.delete.type=Delete
appender.rolling.strategy.delete.basePath=${basePath}
appender.rolling.strategy.delete.maxDepth=10
appender.rolling.strategy.delete.ifLastModified.type=IfLastModified
appender.rolling.strategy.delete.ifLastModified.age=30d

# INFO, not DEBUG. A build log is read when something failed, and burying the one useful line
# under every HTTP frame is the same as not logging at all.
rootLogger.level=info
rootLogger.appenderRef.stdout.ref=consoleLogger
rootLogger.appenderRef.rolling.ref=fileLogger

# Testcontainers at INFO: "creating container", "container started", the mapped ports. This is
# the output that explains a CI failure where the stack would not come up, and the entire reason
# an SLF4J binding is on the classpath at all.
logger.testcontainers.name=org.testcontainers
logger.testcontainers.level=info

# The Docker client underneath it talks HTTP for every poll. At DEBUG that is the wire dump;
# at WARN it is silent unless something is actually wrong.
logger.dockerjava.name=com.github.dockerjava
logger.dockerjava.level=warn
logger.httpclient.name=org.apache.hc
logger.httpclient.level=warn

# This suite's own logging — the scenario banner and the resolved base URI.
logger.suite.name=com.automation.api
logger.suite.level=info
