name: Report

# Publishes the Allure report to GitHub Pages, carrying history forward.
#
# The history is the point. A single report says "25 passed today", which the CI badge already
# said. Restoring the previous run's history/ before generating turns the same data into a trend
# — pass rate, retries and duration over time — which is what tells you whether a suite is
# getting better or worse.
#
# Runs on workflow_run so it triggers off the CI run's artifact, and so a failing suite still
# publishes. A report you only get when everything passed is a report you never need.
#
# No third-party actions. The first version of this workflow used a popular Allure action and it
# could not run at all: it is a Docker action built `FROM openjdk:8-jre-alpine`, an image Docker
# Hub removed with the deprecated openjdk officials, so the build failed before doing anything.
# The report is generated by allure-maven, which this project already depends on — one fewer
# moving part, and one that cannot rot independently of the build.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: allure-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Allure report
    runs-on: ubuntu-latest
    # Default branch only: publishing from every PR branch would overwrite the trend with
    # whatever that branch happened to do.
    if: github.event.workflow_run.head_branch == 'main' || github.event_name == 'workflow_dispatch'

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Download the results from the CI run
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: target/allure-results
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # History is read from the published report over HTTP, not from a cache.
      #
      # It was actions/cache, and that quietly loses the trend: GitHub evicts a cache after
      # seven days without a read, so any week this repository goes untouched resets the graph
      # and no step reports it. Not hypothetical — the trend here had already fallen to ten
      # entries while the sibling mobile repository, which reads history the way this now does,
      # still had twenty.
      #
      # The last published report *is* the previous state, and unlike a cache it cannot expire
      # out from under the workflow.
      - name: Restore history from the published report
        run: |
          site="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}"
          mkdir -p target/allure-results/history
          restored=0
          for file in history.json history-trend.json categories-trend.json duration-trend.json retry-trend.json; do
            if curl -fsSL --max-time 30 -o "target/allure-results/history/$file" "$site/history/$file"; then
              restored=$((restored + 1))
            else
              rm -f "target/allure-results/history/$file"
            fi
          done
          if [ "$restored" -eq 0 ]; then
            echo "No previous history at $site — this will be the first report in the series."
          else
            echo "Carried forward $restored history file(s) from $site."
          fi

      # The report shows nine scenarios named "... is rejected", all green, and a green tick
      # says the same thing whether the assertion held or never ran. The mutation job knows the
      # difference and its verdict was previously buried in a workflow log nobody opens, so it
      # is folded into the Environment widget here — next to the report it qualifies.
      #
      # In this workflow rather than in AllureMetadata because the two jobs are siblings: the
      # test job cannot see the mutation job's result, and this workflow can see both.
      - name: Record the mutation verdict in the report environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expectations=src/test/resources/db/mutation-expectations.txt
          proven=$(grep -cvE '^\s*(#|$)' "$expectations" || echo 0)
          uncoverable=$(grep -cE '^#   (Clients|Resources) endpoint - ' "$expectations" || echo 0)

          run_id="${{ github.event.workflow_run.id }}"
          verdict="not run (report published by hand)"
          if [ -n "$run_id" ]; then
            conclusion=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/jobs" \
              --jq '.jobs[] | select(.name == "Prove the negative tests can fail") | .conclusion' 2>/dev/null || true)
            case "$conclusion" in
              success) verdict="passed - every assertion below went red with its constraint removed" ;;
              "")      verdict="no result found for this run" ;;
              *)       verdict="$conclusion - AN ASSERTION STOPPED BEING FALSIFIABLE" ;;
            esac
          fi

          {
            echo ""
            echo "Negative.tests.proven.falsifiable=$proven (mutation job, see mutation-expectations.txt)"
            echo "Negative.tests.not.coverable=$uncoverable (PostgREST parsing and Postgres type coercion - no constraint to remove)"
            echo "Mutation.job=$verdict"
          } >> target/allure-results/environment.properties
          tail -4 target/allure-results/environment.properties

      # No executor.json here. allure-maven writes its own ("Maven") over anything placed
      # in the results directory, so a hand-written one is dead config that looks like a
      # feature. Shipping it would be worse than its absence. The CI run that produced a report
      # is reachable from the Actions tab in the meantime.

      # allure-maven, already configured in the pom. Output lands in
      # target/site/allure-maven-plugin.
      - name: Generate the report
        run: ./mvnw -B allure:report

      - uses: actions/configure-pages@v6

      - name: Upload the report
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site/allure-maven-plugin

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
