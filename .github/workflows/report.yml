name: Report

# Publishes the Allure report to GitHub Pages, carrying history forward.
#
# The history is the point. A single report says "25 passed today", which the CI badge already
# said. Restoring the previous run's history/ before generating turns the same data into a trend
# — pass rate, retries and duration over time — which is what tells you whether a suite is
# getting better or worse.
#
# Runs on workflow_run so it triggers off the CI run's artifact, and so a failing suite still
# publishes. A report you only get when everything passed is a report you never need.
#
# No third-party actions. The first version of this workflow used a popular Allure action and it
# could not run at all: it is a Docker action built `FROM openjdk:8-jre-alpine`, an image Docker
# Hub removed with the deprecated openjdk officials, so the build failed before doing anything.
# The report is generated by allure-maven, which this project already depends on — one fewer
# moving part, and one that cannot rot independently of the build.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: allure-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Allure report
    runs-on: ubuntu-latest
    # Default branch only: publishing from every PR branch would overwrite the trend with
    # whatever that branch happened to do.
    if: github.event.workflow_run.head_branch == 'main' || github.event_name == 'workflow_dispatch'

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Download the results from the CI run
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # With Pages served from Actions there is no gh-pages branch to read the previous
      # history out of, so it is cached instead. restore-keys makes every run pick up the most
      # recent cache rather than only an exact key match, which is what lets the trend survive.
      - name: Restore previous history
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - name: Carry history forward
        run: |
          if [ -d allure-history ]; then
            cp -r allure-history target/allure-results/history
            echo "restored $(ls allure-history | wc -l) history file(s)"
          else
            echo "no previous history — this is the first published report"
          fi

      # No executor.json here. allure-maven writes its own ("Maven") over anything placed
      # in the results directory, so a hand-written one is dead config that looks like a
      # feature. Shipping it would be worse than its absence. The CI run that produced a report
      # is reachable from the Actions tab in the meantime.

      # allure-maven, already configured in the pom. Output lands in
      # target/site/allure-maven-plugin.
      - name: Generate the report
        run: ./mvnw -B allure:report

      - name: Save history for the next run
        if: always()
        run: |
          rm -rf allure-history
          cp -r target/site/allure-maven-plugin/history allure-history 2>/dev/null \
            || echo "report produced no history directory"

      - name: Cache the history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}

      - uses: actions/configure-pages@v6

      - name: Upload the report
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
