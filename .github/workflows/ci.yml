name: CI

# Every push and pull request. No secrets, no hosted API, no account required — the suite
# starts the API it tests, so a fork gets a green build on its first push.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # GitHub's ubuntu runners ship a working Docker daemon, which is the only thing
      # Testcontainers needs. Nothing else to install and no service container to declare:
      # the suite brings up Postgres and PostgREST itself, so CI runs exactly what a
      # developer runs locally.
      - name: Show Docker version
        run: docker version --format 'Docker {{.Server.Version}} on {{.Server.Os}}/{{.Server.Arch}}'

      - name: Run the suite
        run: mvn -B test

      # if: always() — a failing suite is precisely when the report is worth reading, and
      # `if: failure()` would also skip it when the job is cancelled by its timeout.
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: target/cucumber
          retention-days: 14
          if-no-files-found: warn

      - name: Upload surefire output
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 14
          if-no-files-found: ignore

  # A negative test that cannot fail is not a test, and nothing in a green run distinguishes
  # "the constraint held" from "the assertion never ran". This job removes the constraints the
  # negative scenarios exercise — UNIQUE on email, the CHECKs on stock and price — and requires
  # the suite to go red. A green result here is the failure.
  #
  # The same reasoning as the schema-teeth test, applied to the database rather than to a
  # schema file: prove the check can fail before trusting that it passed.
  mutation:
    name: Prove the negative tests can fail
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Not "did the suite go red" — which one surviving failure would satisfy while the other
      # mutations quietly stopped being caught — but "did exactly the scenarios in
      # mutation-expectations.txt go red". Each line there is a claim that one assertion has
      # teeth, and each is checked individually.
      - name: Run against a schema with the constraints removed
        run: |
          ./mvnw -B test -Dapi.schema=db/init-weakened.sql > mutation.log 2>&1 && SUITE_PASSED=1 || SUITE_PASSED=0

          if [ "$SUITE_PASSED" = "1" ]; then
            echo "::error::The suite PASSED against a schema with every asserted constraint removed."
            echo "::error::None of the negative scenarios is asserting what it claims to assert."
            tail -40 mutation.log
            exit 1
          fi

          # Surefire prints one line per failure as "[ERROR] <FQCN>.<scenario> -- Time elapsed...".
          # The " -- Time" anchor is what separates these from the "Tests run:" summary lines,
          # which end in " -- in <FQCN>".
          sed -n 's/^\[ERROR\] \+\([^ ].*\) -- Time.*/\1/p' mutation.log \
            | sed 's/^com\.automation\.api\.runners\.RunCucumberTest\.//; s/^com\.automation\.api\.//' \
            | sort -u > failed.txt

          grep -vE '^\s*(#|$)' src/test/resources/db/mutation-expectations.txt | sort -u > expected.txt

          echo "### Mutation coverage" >> "$GITHUB_STEP_SUMMARY"
          status=0
          while IFS= read -r scenario; do
            if grep -Fqx "$scenario" failed.txt; then
              echo "- ✅ \`$scenario\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Expected to fail under the weakened schema, but PASSED: $scenario"
              echo "- ❌ **$scenario** — passed with its constraint removed, so nothing proves it can fail" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          done < expected.txt

          # Extras are reported, not required. One is known and documented (the schema-teeth
          # cascade); a genuinely new one is worth a reader's attention without being a failure.
          if comm -13 expected.txt failed.txt | grep -q .; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Also failed, not required by the expectations file:" >> "$GITHUB_STEP_SUMMARY"
            comm -13 expected.txt failed.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$status" != "0" ]; then
            echo "::error::A mutation stopped being caught. See mutation-expectations.txt."
            exit 1
          fi
          echo "All $(wc -l < expected.txt) expected scenarios failed as required."

      - name: Upload the mutation log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-log
          path: mutation.log
          retention-days: 7
          if-no-files-found: ignore
